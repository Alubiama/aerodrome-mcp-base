<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Inspect a reward change</title><desc id="desc">Synthetic MCP example. Reward raw units change from 100 at block 100 to 125 at block 101. Delta 25. Cause and realized income unknown.</desc><rect width="1200" height="540" rx="24" fill="#102c47"/><text x="64" y="68" font-family="Arial,sans-serif" font-size="18" fill="#8fd6f8" letter-spacing="3">AERODROME MCP / INDEPENDENT COMMUNITY TOOL</text><text x="64" y="135" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="white">What changed? Show the evidence.</text><rect x="64" y="182" width="1072" height="226" rx="16" fill="#173d5e"/><text x="100" y="224" font-family="Arial,sans-serif" font-size="18" fill="#a9c8de">SYNTHETIC REWARD · RAW UNITS</text><text x="100" y="315" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="white">100 → 125</text><text x="730" y="308" font-family="Arial,sans-serif" font-size="54" fill="#8fd6f8">+25</text><text x="100" y="366" font-family="Arial,sans-serif" font-size="23" fill="#c7dfef">Blocks 100 → 101 · COMPARED</text><text x="64" y="464" font-family="Arial,sans-serif" font-size="23" fill="white">Observed amount changed. Cause and realized income: unknown.</text><text x="64" y="504" font-family="Arial,sans-serif" font-size="17" fill="#a9c8de">Offline fixture · No wallet connection · No transaction signing · Not a live reward result</text></svg>